<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORFK • SunRise RP — Büntetéskalkulátor</title><style>body{margin:0;background:#050b12;color:#edf5fc;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px 18px}.box{background:#0b1724;border:1px solid #25435e;border-radius:8px;padding:22px;margin-top:20px}h1{font-size:42px;margin:0 0 10px}h1 span{color:#65b6ff}.muted{color:#8fa6bb}select,input,button{font:inherit}select{width:100%;padding:14px;background:#07111c;color:white;border:1px solid #31506a;border-radius:6px}button{cursor:pointer;padding:11px 14px;border-radius:5px;border:1px solid #326b9f;background:#0b2944;color:#9bd2ff;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{background:#07111c;border:1px solid #20364d;border-radius:6px;padding:15px;margin-top:12px}.value{font-size:24px;font-weight:bold}.fine{color:#48df87}.jail{color:#ff687d}.counter{display:flex;gap:8px;margin-top:8px}.counter input{width:100%;text-align:center;background:#07111c;color:white;border:1px solid #31506a;border-radius:5px}.actions{display:grid;gap:8px;margin-top:15px}.copy{background:#2588ff;color:white}.chosen{padding:10px;border:1px solid #20364d;border-radius:5px;margin-top:8px}.remove{float:right;padding:5px 9px;color:#ff8292;background:#1b0e13;border-color:#5a3039}@media(max-width:750px){.grid{grid-template-columns:1fr}h1{font-size:34px}}</style></head><body><main class="wrap"><div class="box"><div class="muted">ORFK // SUNRISE RP</div><h1>BÜNTETÉS <span>KALKULÁTOR</span></h1><p class="muted">A központi btk.json adataiból dolgozik.</p></div><div class="grid"><section class="box"><h2>BTK-TÉTEL</h2><select id="law"><option value="">BTK adatok betöltése…</option></select><div id="details"></div></section><aside class="box"><h2>INTÉZKEDÉS <span id="status" class="muted">ÜRES</span></h2><div id="items"><p class="muted">Még nincs hozzáadott tétel.</p></div><div id="totals"></div></aside></div></main><script>
const state={laws:[],items:[],selected:null};const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('hu-HU').format(Number(n)||0)+' Ft';const duration=n=>{n=Number(n)||0;const h=Math.floor(n/60),m=n%60;return h?(m?h+' óra '+m+' perc':h+' óra'):m+' perc'};
async function load(){try{const r=await fetch('./btk.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();state.laws=Array.isArray(d)?d:(Array.isArray(d.items)?d.items:[]);if(!state.laws.length)throw Error('Üres BTK adatbázis');const s=$('law');s.innerHTML='<option value="">— VÁLASSZ EGY BTK-TÉTELT —</option>';state.laws.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(x.para||'')+' — '+(x.name||'');s.appendChild(o)});}catch(e){$('law').innerHTML='<option>— BTK ADATBÁZIS HIBA —</option>';$('details').innerHTML='<div class="card">Nem sikerült betölteni a btk.json fájlt.<br>'+e.message+'</div>';console.error(e)}}
$('law').onchange=function(){const i=this.value;if(i===''){state.selected=null;$('details').innerHTML='';return}const x=state.laws[Number(i)];state.selected=x;$('details').innerHTML='<div class="card"><b>'+x.para+' — '+x.name+'</b><p class="muted">'+(x.desc||'')+'</p><div class="grid"><div><small>EGYSÉGBÍRSÁG</small><div class="value fine">'+money(x.fine)+'</div></div><div><small>EGYSÉGBÜNTETÉS</small><div class="value jail">'+duration(x.jail)+'</div></div></div><label>TÉTELEK SZÁMA</label><div class="counter"><button onclick="changeQty(-1)">−</button><input id="qty" type="number" min="1" value="1"><button onclick="changeQty(1)">+</button></div><button style="margin-top:10px;width:100%" onclick="add()">＋ HOZZÁADÁS</button></div>'};
function changeQty(n){const q=$('qty');q.value=Math.max(1,(Number(q.value)||1)+n)}function add(){if(!state.selected)return;const q=Math.max(1,Number($('qty').value)||1);const old=state.items.find(i=>i.x.para===state.selected.para);if(old)old.q+=q;else state.items.push({x:state.selected,q});render()}function remove(i){state.items.splice(i,1);render()}
function render(){let f=0,j=0;state.items.forEach(i=>{f+=Number(i.x.fine||0)*i.q;j+=Number(i.x.jail||0)*i.q});$('status').textContent=state.items.length?state.items.length+' TÉTEL':'ÜRES';$('items').innerHTML=state.items.length?state.items.map((i,n)=>'<div class="chosen"><button class="remove" onclick="remove('+n+')">×</button><b>'+i.x.para+' — '+i.x.name+'</b><br><small>×'+i.q+' • '+money(i.x.fine*i.q)+' • '+duration(i.x.jail*i.q)+'</small></div>').join(''):'<p class="muted">Még nincs hozzáadott tétel.</p>';$('totals').innerHTML=state.items.length?'<div class="card"><b>ÖSSZES BÍRSÁG</b><div class="value fine">'+money(f)+'</div><b>ÖSSZES BÖRTÖN</b><div class="value jail">'+duration(j)+'</div><div class="actions"><button class="copy" onclick="copyRP()">📋 MÁSOLÁS RP-BE</button><button onclick="state.items=[];render()">INTÉZKEDÉS TÖRLÉSE</button></div></div>':''}
function copyRP(){let f=0,j=0;const rows=state.items.map(i=>{f+=i.x.fine*i.q;j+=i.x.jail*i.q;return i.x.para+' – '+i.x.name+' | '+i.q+' db | '+money(i.x.fine*i.q)+' | '+duration(i.x.jail*i.q)});const t='[ORFK | SUNRISE RP]\nBÜNTETÉSI INTÉZKEDÉS\n\n'+rows.join('\n')+'\n--------------------\nÖSSZES BÍRSÁG: '+money(f)+'\nÖSSZES BÖRTÖN: '+duration(j);if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert('Kimásolva!')).catch(()=>prompt('Másold ki:',t));else prompt('Másold ki:',t)}load();
</script></body></html>
