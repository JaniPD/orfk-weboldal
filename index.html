<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORFK // Tactical CAD System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap');

        :root {
            --bg-void: #050811;
            --panel-bg: rgba(10, 16, 30, 0.85);
            --neon-blue: #00f0ff;
            --neon-gold: #ffb703;
            --neon-red: #ff2a6d;
            --text-dim: #4e618d;
            --text-bright: #e2e8f0;
            --border-glow: rgba(0, 240, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
            user-select: none;
        }

        body {
            background-color: var(--bg-void);
            color: var(--text-bright);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            overflow-x: hidden;
        }

        /* TOP HUD BAR */
        .hud-header {
            background: rgba(5, 8, 17, 0.95);
            border-bottom: 2px solid var(--neon-blue);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        .sys-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sys-title span {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .hud-status {
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .status-val {
            color: var(--neon-gold);
            font-weight: 600;
        }

        /* MAIN HUD LAYOUT */
        .hud-grid {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 20px;
            padding: 20px;
            flex: 1;
            max-width: 1800px;
            width: 100%;
            margin: 0 auto;
        }

        /* LEFT: TACTICAL MATRIX */
        .matrix-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 4px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .matrix-panel::before {
            content: "TAC_MATRIX // BTK_DATABASE";
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg-void);
            padding: 0 10px;
            font-size: 0.7rem;
            color: var(--neon-blue);
            letter-spacing: 2px;
            border: 1px solid var(--border-glow);
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .search-hud {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glow);
            padding: 12px 16px;
            color: var(--neon-blue);
            font-size: 0.9rem;
            outline: none;
        }

        .search-hud:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .cat-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: var(--text-dim);
            padding: 8px 14px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--neon-blue);
            color: var(--bg-void);
            font-weight: 800;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .crime-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            overflow-y: auto;
            max-height: calc(100vh - 260px);
            padding-right: 5px;
        }

        .crime-card {
            background: rgba(5, 12, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .crime-card:hover {
            border-color: var(--neon-blue);
            transform: translateX(4px);
            background: rgba(0, 240, 255, 0.08);
        }

        .crime-code {
            font-size: 0.7rem;
            color: var(--neon-gold);
            margin-bottom: 4px;
        }

        .crime-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .crime-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        /* RIGHT: MDC FEED / DOCKET */
        .docket-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 183, 3, 0.3);
            border-radius: 4px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .docket-panel::before {
            content: "ACTIVE_ARREST_LOG // MDC_FEED";
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--bg-void);
            padding: 0 10px;
            font-size: 0.7rem;
            color: var(--neon-gold);
            letter-spacing: 2px;
            border: 1px solid rgba(255, 183, 3, 0.3);
        }

        .docket-items {
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 400px;
        }

        .docket-row {
            background: rgba(0, 0, 0, 0.5);
            border-left: 3px solid var(--neon-blue);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-remove {
            color: var(--neon-red);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .docket-summary {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border-glow);
            padding: 15px;
            margin-top: auto;
        }

        .sum-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .sum-val {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .btn-action-hud {
            width: 100%;
            padding: 14px;
            background: var(--neon-blue);
            color: var(--bg-void);
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-action-hud:hover {
            box-shadow: 0 0 20px var(--neon-blue);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="hud-header">
        <div class="sys-title">
            <span>//</span> ORFK_TAC_CAD <span>v4.0</span>
        </div>
        <div class="hud-status">
            <div>STATUS: <span class="status-val">CONNECTED</span></div>
            <div>ENC: <span class="status-val">AES-256</span></div>
        </div>
    </div>

    <div class="hud-grid">
        <!-- BAL OSZLOP: DATABASE -->
        <div class="matrix-panel">
            <div class="filter-bar">
                <input type="text" id="hudSearch" class="search-hud" placeholder="> VÁDPONT VAGY KÓD KERESÉSE..." oninput="renderCrimes()">
            </div>

            <div class="cat-tabs">
                <button class="tab-btn active" onclick="setCategory('ALL', this)">ÖSSZES</button>
                <button class="tab-btn" onclick="setCategory('KÖZLEKEDÉS', this)">KÖZLEKEDÉS</button>
                <button class="tab-btn" onclick="setCategory('HATÓSÁG', this)">HATÓSÁG</button>
                <button class="tab-btn" onclick="setCategory('KÖZREND', this)">KÖZREND</button>
                <button class="tab-btn" onclick="setCategory('SZEMÉLY/VAGYON', this)">SZEMÉLY/VAGYON</button>
            </div>

            <div class="crime-list" id="crimeContainer">
                <!-- JavaScript tölti fel -->
            </div>
        </div>

        <!-- JOBB OSZLOP: MDC DOCKET -->
        <div class="docket-panel">
            <div class="docket-items" id="docketContainer">
                <div style="text-align: center; color: var(--text-dim); margin: auto;">NINCS KIVÁLASZTOTT VÁDPONT</div>
            </div>

            <div class="docket-summary">
                <div class="sum-line">
                    <span>BÍRSÁG ÖSSZESEN:</span>
                    <span class="sum-val" style="color: var(--neon-gold);" id="totalFine">0 FT</span>
                </div>
                <div class="sum-line">
                    <span>BÖRTÖN ÖSSZESEN:</span>
                    <span class="sum-val" style="color: var(--neon-red);" id="totalJail">0 PERC</span>
                </div>
                <button class="btn-action-hud" onclick="exportDocket()">MDC LOG GENERÁLÁSA</button>
            </div>
        </div>
    </div>

    <script>
        const database = [
            { code: "§1.1", title: "Tilosban parkolás", fine: 30000, jail: 0, cat: "KÖZLEKEDÉS" },
            { code: "§1.3", title: "Súlyos sebességtúllépás", fine: 90000, jail: 0, cat: "KÖZLEKEDÉS" },
            { code: "§1.20", title: "Menekülés járművel", fine: 150000, jail: 20, cat: "KÖZLEKEDÉS" },
            { code: "§2.1", title: "Intézkedés akadályozása", fine: 80000, jail: 10, cat: "HATÓSÁG" },
            { code: "§2.6", title: "Hivatalos személy elleni erőszak", fine: 200000, jail: 30, cat: "HATÓSÁG" },
            { code: "§3.1", title: "Garázdaság", fine: 120000, jail: 15, cat: "KÖZREND" },
            { code: "§3.6", title: "Illegális fegyverbirtoklás (Nehéz)", fine: 350000, jail: 40, cat: "KÖZREND" },
            { code: "§3.9", title: "Kábítószer kereskedelem", fine: 300000, jail: 35, cat: "KÖZREND" },
            { code: "§4.7", title: "Emberölés / Gyilkosság", fine: 500000, jail: 60, cat: "SZEMÉLY/VAGYON" },
            { code: "§4.9", title: "Emberrablás", fine: 450000, jail: 50, cat: "SZEMÉLY/VAGYON" },
            { code: "§5.11", title: "Bankrablás", fine: 450000, jail: 40, cat: "SZEMÉLY/VAGYON" }
        ];

        let activeCategory = 'ALL';
        let docket = [];

        function setCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCrimes();
        }

        function renderCrimes() {
            const search = document.getElementById('hudSearch').value.toLowerCase();
            const container = document.getElementById('crimeContainer');
            container.innerHTML = '';

            database.filter(item => {
                const matchCat = activeCategory === 'ALL' || item.cat === activeCategory;
                const matchSearch = item.title.toLowerCase().includes(search) || item.code.toLowerCase().includes(search);
                return matchCat && matchSearch;
            }).forEach(item => {
                const div = document.createElement('div');
                div.className = 'crime-card';
                div.onclick = () => addToDocket(item);
                div.innerHTML = `
                    <div class="crime-code">${item.code} // ${item.cat}</div>
                    <div class="crime-title">${item.title}</div>
                    <div class="crime-stats">
                        <span>💰 ${item.fine.toLocaleString()} FT</span>
                        <span>🔒 ${item.jail} PERC</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function addToDocket(item) {
            docket.push({ ...item, id: Date.now() + Math.random() });
            renderDocket();
        }

        function removeFromDocket(id) {
            docket = docket.filter(i => i.id !== id);
            renderDocket();
        }

        function renderDocket() {
            const container = document.getElementById('docketContainer');
            container.innerHTML = '';

            if (docket.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-dim); margin: auto;">NINCS KIVÁLASZTOTT VÁDPONT</div>';
                updateTotals(0, 0);
                return;
            }

            let fine = 0, jail = 0;

            docket.forEach(item => {
                fine += item.fine;
                jail += item.jail;

                const div = document.createElement('div');
                div.className = 'docket-row';
                div.innerHTML = `
                    <div>
                        <div style="font-size: 0.8rem; color: #fff;">${item.code} ${item.title}</div>
                        <div style="font-size: 0.7rem; color: var(--text-dim);">${item.fine.toLocaleString()} FT | ${item.jail} MIN</div>
                    </div>
                    <button class="btn-remove" onclick="removeFromDocket(${item.id})">✖</button>
                `;
                container.appendChild(div);
            });

            updateTotals(fine, jail);
        }

        function updateTotals(fine, jail) {
            document.getElementById('totalFine').innerText = fine.toLocaleString() + ' FT';
            document.getElementById('totalJail').innerText = jail + ' PERC';
        }

        function exportDocket() {
            if (docket.length === 0) return;
            let log = `=== ORFK TAC LOG ===\nVÁDCSOMAG:\n`;
            docket.forEach(i => log += `> ${i.code} ${i.title}\n`);
            log += `-------------------\nÖSSZESEN: ${document.getElementById('totalFine').innerText} / ${document.getElementById('totalJail').innerText}`;
            navigator.clipboard.writeText(log);
            alert("MDC LOG MÁSOLVA A VÁGÓLAPRA!");
        }

        renderCrimes();
    </script>
</body>
</html>
