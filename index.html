<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORFK - BTK & Regiszter</title>
    
    <!-- Betűtípus és Ikonok -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0066ff;
            --accent: #ffaa00;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Fejléc / Navigáció */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: #1e293b;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .badge {
            background: var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            color: #fff;
        }

        .divider {
            color: var(--text-muted);
        }

        .server-name {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 15px;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 8px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link:hover, .nav-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Server Status */
        .server-status {
            font-size: 0.85rem;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }

        /* Főtartalom */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2.5rem 1rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Kereső */
        .search-section {
            margin-bottom: 2.5rem;
        }

        .search-bar {
            position: relative;
            max-width: 650px;
            margin: 0 auto;
        }

        .search-bar input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            color: #fff;
            font-size: 0.95rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .quick-tags {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .tag-title {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .tag {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .tag:hover {
            border-color: var(--primary);
            color: #fff;
        }

        /* Statisztikák */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.2rem;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: rgba(0, 102, 255, 0.15);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .stat-icon.warning { background: rgba(255, 170, 0, 0.15); color: var(--accent); }
        .stat-icon.success { background: rgba(16, 185, 129, 0.15); color: #10b981; }

        .stat-info h3 {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-number {
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 2px;
        }

        /* Akció gombok */
        .quick-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 2rem;
        }

        .action-btn {
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .primary-btn {
            background: var(--primary);
            color: #fff;
        }

        .primary-btn:hover {
            background: #0052cc;
        }

        .secondary-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
        }

        .secondary-btn:hover {
            background: var(--card-border);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <span class="badge">ORFK</span>
            <span class="divider">|</span>
            <span class="server-name">SunRise RP</span>
        </div>
        <nav>
            <a href="#btk" class="nav-link active"><i class="fa-solid fa-book"></i> BTK Search</a>
            <a href="#register" class="nav-link"><i class="fa-solid fa-id-card"></i> Körözések</a>
            <a href="#stats" class="nav-link"><i class="fa-solid fa-chart-line"></i> Statisztika</a>
        </nav>
        <div class="server-status">
            <span class="status-dot"></span> Szerver Online
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Országos Rendőr-főkapitányság</h1>
            <p class="subtitle">Büntető Törvénykönyv és Intelligens Adatbázis Rendszer</p>
        </section>

        <!-- Kereső Szekció -->
        <section class="search-section">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Keresés cikk, tényállás vagy bűncselekmény alapján...">
            </div>
            
            <div class="quick-tags">
                <span class="tag-title">Gyakori keresések:</span>
                <button class="tag">#Rablás</button>
                <button class="tag">#Cserbenhagyás</button>
                <button class="tag">#Gyilkosság</button>
                <button class="tag">#Kábítószer</button>
            </div>
        </section>

        <!-- Statisztikai Kártyák -->
        <section class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-gavel"></i></div>
                <div class="stat-info">
                    <h3>BTK Cikkelyek</h3>
                    <p class="stat-number">124</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning"><i class="fa-solid fa-user-ninja"></i></div>
                <div class="stat-info">
                    <h3>Aktív Körözések</h3>
                    <p class="stat-number">18</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon success"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="stat-info">
                    <h3>Szolgálatban</h3>
                    <p class="stat-number">12 Fő</p>
                </div>
            </div>
        </section>

        <!-- Akció gombok -->
        <section class="quick-actions">
            <button class="action-btn primary-btn"><i class="fa-solid fa-plus"></i> Új Körözés Kiadása</button>
            <button class="action-btn secondary-btn"><i class="fa-solid fa-file-pdf"></i> BTK Letöltése (PDF)</button>
        </section>
    </main>

</body>
</html>
