<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORFK - BTK & Regiszter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0066ff;
            --accent: #ffaa00;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Header & Navigáció */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: #1e293b;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .badge {
            background: var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            color: #fff;
        }

        .divider {
            color: var(--text-muted);
        }

        .server-name {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 16px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* Kereső Szekció */
        .search-section {
            margin-bottom: 2.5rem;
        }

        .search-bar {
            position: relative;
            max-width: 700px;
            margin: 0 auto 1.5rem auto;
        }

        .search-bar input {
            width: 100%;
            padding: 18px 20px 18px 55px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            color: #fff;
            font-size: 1rem;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .filter-tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Statisztikák */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.5rem;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: rgba(0, 102, 255, 0.15);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .stat-icon.warning { background: rgba(255, 170, 0, 0.15); color: var(--accent); }
        .stat-icon.success { background: rgba(16, 185, 129, 0.15); color: #10b981; }

        .stat-info h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <span class="badge">ORFK</span>
            <span class="divider">|</span>
            <span class="server-name">SunRise RP</span>
        </div>
        <nav>
            <a href="#btk" class="nav-link active"><i class="fa-solid fa-book"></i> BTK Search</a>
            <a href="#register" class="nav-link"><i class="fa-solid fa-id-card"></i> Körözések</a>
            <a href="#stats" class="nav-link"><i class="fa-solid fa-chart-line"></i> Statisztika</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Országos Rendőr-főkapitányság</h1>
            <p class="subtitle">Büntető Törvénykönyv és Intelligens Adatbázis Rendszer</p>
        </section>

        <!-- Kereső és Szűrő Szekció -->
        <section class="search-section">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Keresés cikk, tényállás vagy bűncselekmény alapján...">
            </div>
            <div class="filter-tags">
                <button class="filter-btn active">Összes</button>
                <button class="filter-btn">Könnyű Vétség</button>
                <button class="filter-btn">Súlyos Bűncselekmény</button>
            </div>
        </section>

        <!-- Statisztikai Kártyák -->
        <section class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-gavel"></i></div>
                <div class="stat-info">
                    <h3>BTK Cikkelyek</h3>
                    <p class="stat-number">124</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning"><i class="fa-solid fa-user-ninja"></i></div>
                <div class="stat-info">
                    <h3>Aktív Körözések</h3>
                    <p class="stat-number">18</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon success"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="stat-info">
                    <h3>Szolgálatban</h3>
                    <p class="stat-number">12 Fő</p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
