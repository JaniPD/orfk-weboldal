<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORFK // CYBER-HUD TERMINAL v3.5</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --bg-dark: #030712;
            --panel-bg: rgba(10, 15, 29, 0.85);
            --neon-cyan: #00f0ff;
            --neon-pink: #ff0055;
            --neon-amber: #ffb703;
            --border-line: rgba(0, 240, 255, 0.25);
            --text-main: #e2e8f0;
            --text-dim: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* TOP HUD BANNER */
        .hud-banner {
            background: rgba(3, 7, 18, 0.95);
            border-bottom: 2px solid var(--neon-cyan);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .hud-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-logo span {
            color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        /* LAYOUT GRID */
        .hud-container {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 20px;
            padding: 20px;
            flex: 1;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        /* PANELS */
        .hud-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-line);
            border-radius: 4px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hud-panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), transparent);
        }

        .panel-head {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.4);
            color: var(--neon-cyan);
            border-bottom: 1px solid var(--border-line);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* FILTER & SEARCH */
        .controls-bar {
            padding: 12px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-line);
        }

        .hud-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-line);
            padding: 10px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .hud-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .cat-bar {
            padding: 10px 12px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-line);
        }

        .cat-btn {
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid var(--border-line);
            color: var(--text-dim);
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* GRID CARDS */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            padding: 15px;
            overflow-y: auto;
            max-height: calc(100vh - 250px);
        }

        .cyber-card {
            background: rgba(5, 12, 24, 0.8);
            border: 1px solid var(--border-line);
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .cyber-card:hover {
            border-color: var(--neon-cyan);
            transform: translateY(-2px);
            background: rgba(0, 240, 255, 0.08);
        }

        .card-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--neon-amber);
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .card-foot {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        /* RIGHT DOCKET */
        .docket-list {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 320px);
        }

        .docket-card {
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid var(--neon-cyan);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-panel {
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid var(--border-line);
            padding: 15px;
            margin-top: auto;
        }

        .sum-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .sum-val {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--neon-cyan);
            color: var(--bg-dark);
            border: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            box-shadow: 0 0 15px var(--neon-cyan);
        }
    </style>
</head>
<body>

    <div class="hud-banner">
        <div class="hud-logo">
            <span>//</span> ORFK_TAC_HUD v3.5
        </div>
        <div style="font-size: 0.85rem; color: var(--text-dim);">
            DATABASE: <span style="color: var(--neon-cyan);">FULL BTK LOADED</span>
        </div>
    </div>

    <div class="hud-container">
        <!-- BAL OSZLOP -->
        <div class="hud-panel">
            <div class="panel-head">
                <span>BTK MÁTRIX ADATBÁZIS</span>
                <span id="counter" style="color: var(--text-dim);">0 tétel</span>
            </div>
            
            <div class="controls-bar">
                <input type="text" id="hudSearch" class="hud-input" placeholder="> VÁDPONT VAGY KÓD KERESÉSE..." oninput="renderCards()">
            </div>

            <div class="cat-bar">
                <button class="cat-btn active" onclick="setCat('ALL', this)">ÖSSZES</button>
                <button class="cat-btn" onclick="setCat('KÖZLEKEDÉS', this)">KÖZLEKEDÉS</button>
                <button class="cat-btn" onclick="setCat('HATÓSÁG', this)">HATÓSÁG</button>
                <button class="cat-btn" onclick="setCat('KÖZREND', this)">KÖZREND</button>
                <button class="cat-btn" onclick="setCat('SZEMÉLY/VAGYON', this)">SZEMÉLY & VAGYON</button>
                <button class="cat-btn" onclick="setCat('ILLEGÁLIS', this)">ILLEGÁLIS TÁRGYAK</button>
            </div>

            <div class="cards-grid" id="cardsGrid"></div>
        </div>

        <!-- JOBB OSZLOP -->
        <div class="hud-panel">
            <div class="panel-head">
                <span>ÉLŐ INTÉZKEDÉSI JEGYZÉK</span>
                <button onclick="clearDocket()" style="background:none; border:none; color:var(--neon-pink); cursor:pointer; font-weight:700;">TÖRLÉS</button>
            </div>

            <div class="docket-list" id="docketList">
                <div style="margin: auto; color: var(--text-dim); text-align: center;">NINCS KIVÁLASZTOTT VÁDPONT</div>
            </div>

            <div class="summary-panel">
                <div class="sum-item">
                    <span>BÍRSÁG ÖSSZESEN:</span>
                    <span class="sum-val" style="color: var(--neon-amber);" id="totalFine">0 FT</span>
                </div>
                <div class="sum-item">
                    <span>BÖRTÖN ÖSSZESEN:</span>
                    <span class="sum-val" style="color: var(--neon-pink);" id="totalJail">0 PERC</span>
                </div>
                <button class="btn-action" onclick="copyDocket()">MDC ADATLAP MÁSOLÁSA</button>
            </div>
        </div>
    </div>

    <script>
        const btkData = [
            // KÖZLEKEDÉS
            { code: "§1.1", title: "Tilosban parkolás", fine: 30000, jail: 0, cat: "KÖZLEKEDÉS" },
            { code: "§1.2", title: "Sebességtúllépás (Csekély)", fine: 50000, jail: 0, cat: "KÖZLEKEDÉS" },
            { code: "§1.3", title: "Sebességtúllépás (Súlyos)", fine: 100000, jail: 0, cat: "KÖZLEKEDÉS" },
            { code: "§1.4", title: "Veszélyes vezetés / Garázdaság járművel", fine: 120000, jail: 10, cat: "KÖZLEKEDÉS" },
            { code: "§1.5", title: "Ittas / Bódult vezetés", fine: 150000, jail: 15, cat: "KÖZLEKEDÉS" },
            { code: "§1.6", title: "Jogosítvány nélküli vezetés", fine: 80000, jail: 0, cat: "KÖZLEKEDÉS" },
            { code: "§1.7", title: "Cserbenhagyás / Cserbenhagyásos gázolás", fine: 200000, jail: 30, cat: "KÖZLEKEDÉS" },
            { code: "§1.8", title: "Menekülés járőrkocsi elől (Járművel)", fine: 250000, jail: 35, cat: "KÖZLEKEDÉS" },

            // HATÓSÁG
            { code: "§2.1", title: "Intézkedés megtagadása / Akadályozása", fine: 90000, jail: 15, cat: "HATÓSÁG" },
            { code: "§2.2", title: "Hatósági személy félrevezetése / Hamis tanúzás", fine: 110000, jail: 20, cat: "HATÓSÁG" },
            { code: "§2.3", title: "Rendőri utasítás figyelmen kívül hagyása", fine: 60000, jail: 10, cat: "HATÓSÁG" },
            { code: "§2.4", title: "Rendőri egyenruha / Jelvény bitorlása", fine: 180000, jail: 25, cat: "HATÓSÁG" },
            { code: "§2.5", title: "Verbalis fenyegetés hivatalos személy ellen", fine: 150000, jail: 20, cat: "HATÓSÁG" },
            { code: "§2.6", title: "Hivatalos személy elleni erőszak", fine: 300000, jail: 45, cat: "HATÓSÁG" },
            { code: "§2.7", title: "Vesztegetés / Korrupciós kísérlet", fine: 200000, jail: 30, cat: "HATÓSÁG" },

            // KÖZREND
            { code: "§3.1", title: "Garázdaság / Rendbontás", fine: 100000, jail: 15, cat: "KÖZREND" },
            { code: "§3.2", title: "Csendháborítás / Közösségellenes magatartás", fine: 40000, jail: 0, cat: "KÖZREND" },
            { code: "§3.3", title: "Rendőri hívószám / Sürgősségi vonal visszaélése", fine: 120000, jail: 10, cat: "KÖZREND" },
            { code: "§3.4", title: "Tiltott tüntetés / Zendülés", fine: 150000, jail: 25, cat: "KÖZREND" },
            { code: "§3.5", title: "Rendőri kordon / Lezárt terület megsértése", fine: 80000, jail: 10, cat: "KÖZREND" },

            // SZEMÉLY/VAGYON
            { code: "§4.1", title: "Lopás (Kisebb értékre)", fine: 70000, jail: 10, cat: "SZEMÉLY/VAGYON" },
            { code: "§4.2", title: "Lopás (Nagy értékre)", fine: 150000, jail: 20, cat: "SZEMÉLY/VAGYON" },
            { code: "§4.3", title: "Rablás / Fegyveres rablás", fine: 300000, jail: 40, cat: "SZEMÉLY/VAGYON" },
            { code: "§4.4", title: "Rongálás / Magántulajdon megsemmisítése", fine: 90000, jail: 15, cat: "SZEMÉLY/VAGYON" },
            { code: "§4.5", title: "Könnyű testi sértés", fine: 120000, jail: 20, cat: "SZEMÉLY/VAGYON" },
            { code: "§4.6", title: "Súlyos testi sértés", fine: 250000, jail: 35, cat: "SZEMÉLY/VAGYON" },
            { code: "§4.7", title: "Emberölés / Gyilkosság", fine: 500000, jail: 60, cat: "SZEMÉLY/VAGYON" },
            { code: "§4.8", title: "Emberrablás / Tuszszedés", fine: 450000, jail: 50, cat: "SZEMÉLY/VAGYON" },
            { code: "§4.9", title: "Bankrablás / Széfborítás", fine: 500000, jail: 60, cat: "SZEMÉLY/VAGYON" },

            // ILLEGÁLIS TÁRGYAK
            { code: "§5.1", title: "Illegális bırtoklás (Csekély mennyiségű kábítószer)", fine: 100000, jail: 15, cat: "ILLEGÁLIS" },
            { code: "§5.2", title: "Kábítószer kereskedelem / Terjesztés", fine: 350000, jail: 40, cat: "ILLEGÁLIS" },
            { code: "§5.3", title: "Illegális fegyverbirtoklás (Maroklőfegyver)", fine: 200000, jail: 30, cat: "ILLEGÁLIS" },
            { code: "§5.4", title: "Illegális fegyverbirtoklás (Gépkarabély / Automata)", fine: 400000, jail: 50, cat: "ILLEGÁLIS" },
            { code: "§5.5", title: "Fegyverkereskedelem", fine: 500000, jail: 60, cat: "ILLEGÁLIS" },
            { code: "§5.6", title: "Tiltott robbanóanyag / Gránát birtoklása", fine: 450000, jail: 55, cat: "ILLEGÁLIS" }
        ];

        let activeCat = 'ALL';
        let docket = [];

        function setCat(cat, btn) {
            activeCat = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
        }

        function renderCards() {
            const query = document.getElementById('hudSearch').value.toLowerCase();
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            const filtered = btkData.filter(item => {
                const matchCat = activeCat === 'ALL' || item.cat === activeCat;
                const matchSearch = item.title.toLowerCase().includes(query) || item.code.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });

            document.getElementById('counter').innerText = `${filtered.length} tétel`;

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'cyber-card';
                card.onclick = () => addDocket(item);
                card.innerHTML = `
                    <div class="card-code">${item.code} // ${item.cat}</div>
                    <div class="card-title">${item.title}</div>
                    <div class="card-foot">
                        <span>💰 ${item.fine.toLocaleString()} FT</span>
                        <span>🔒 ${item.jail} PERC</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addDocket(item) {
            docket.push({ ...item, id: Date.now() + Math.random() });
            renderDocket();
        }

        function removeDocket(id) {
            docket = docket.filter(i => i.id !== id);
            renderDocket();
        }

        function clearDocket() {
            docket = [];
            renderDocket();
        }

        function renderDocket() {
            const list = document.getElementById('docketList');
            list.innerHTML = '';

            if (docket.length === 0) {
                list.innerHTML = '<div style="margin: auto; color: var(--text-dim); text-align: center;">NINCS KIVÁLASZTOTT VÁDPONT</div>';
                updateTotals(0, 0);
                return;
            }

            let fine = 0, jail = 0;

            docket.forEach(item => {
                fine += item.fine;
                jail += item.jail;

                const row = document.createElement('div');
                row.className = 'docket-card';
                row.innerHTML = `
                    <div>
                        <div style="font-weight:700; color:#fff; font-size:0.85rem;">${item.code} ${item.title}</div>
                        <div style="font-size:0.75rem; color:var(--text-dim);">${item.fine.toLocaleString()} FT | ${item.jail} PERC</div>
                    </div>
                    <button onclick="removeDocket(${item.id})" style="background:none; border:none; color:var(--neon-pink); cursor:pointer; font-size:1.1rem;">✖</button>
                `;
                list.appendChild(row);
            });

            updateTotals(fine, jail);
        }

        function updateTotals(f, j) {
            document.getElementById('totalFine').innerText = f.toLocaleString() + ' FT';
            document.getElementById('totalJail').innerText = j + ' PERC';
        }

        function copyDocket() {
            if (docket.length === 0) return;
            let log = `=== ORFK TAC LOG ===\nVÁDCSOMAG:\n`;
            docket.forEach(i => log += `> ${i.code} ${i.title}\n`);
            log += `-------------------\nÖSSZESEN: ${document.getElementById('totalFine').innerText} / ${document.getElementById('totalJail').innerText}`;
            navigator.clipboard.writeText(log);
            alert("MDC LOG MÁSOLVA A VÁGÓLAPRA!");
        }

        renderCards();
    </script>
</body>
</html>
