<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORFK // Command Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap');

        :root {
            --bg-dark: #070a12;
            --panel-bg: rgba(13, 20, 36, 0.9);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-amber: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
        }

        /* HEADER */
        header {
            background: rgba(7, 10, 18, 0.95);
            border-bottom: 1px solid var(--panel-border);
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .brand-badge {
            background: var(--accent-amber);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        /* HÁROMOSZLOPOS GRID */
        .main-layout {
            display: grid;
            grid-template-columns: 240px 1fr 380px;
            gap: 15px;
            padding: 15px;
            flex: 1;
            height: calc(100vh - 60px);
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--panel-border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent-amber);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* BAL OSZLOP: NAVIGÁCIÓ & SZŰRŐK */
        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 12px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(245, 158, 11, 0.1);
            color: var(--accent-amber);
        }

        /* KÖZÉPSŐ OSZLOP: ADATBÁZIS MÁTRIX */
        .search-box {
            padding: 10px 15px;
            border-bottom: 1px solid var(--panel-border);
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 10px 12px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-amber);
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            padding: 15px;
            overflow-y: auto;
        }

        .btk-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btk-card:hover {
            border-color: var(--accent-amber);
            background: rgba(245, 158, 11, 0.04);
        }

        .btk-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent-amber);
            margin-bottom: 4px;
        }

        .btk-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .btk-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* JOBB OSZLOP: ELJÁRÁSI LAP */
        .docket-content {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .docket-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-left: 3px solid var(--accent-amber);
            padding: 8px 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .mod-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            padding: 10px;
            border-top: 1px solid var(--panel-border);
        }

        .btn-mod {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 6px;
            font-size: 0.7rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-mod.active {
            background: var(--accent-amber);
            color: #000;
            font-weight: 700;
        }

        .summary-box {
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid var(--panel-border);
        }

        .sum-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .val-fine {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: #22c55e;
            font-weight: 700;
        }

        .val-jail {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--accent-red);
            font-weight: 700;
        }

        .btn-export {
            width: 100%;
            background: var(--accent-amber);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-export:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-badge">ORFK</span> COMMAND TERMINAL v2.5
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">
            OPERATOR: <span style="color: #fff;">AKTÍV JÁRŐR</span>
        </div>
    </header>

    <div class="main-layout">
        <!-- BAL OSZLOP -->
        <div class="panel">
            <div class="panel-header">KATEGÓRIÁK</div>
            <div class="nav-list">
                <button class="nav-item active" onclick="filterCat('ALL', this)">Összes Vádpont</button>
                <button class="nav-item" onclick="filterCat('KÖZLEKEDÉS', this)">Közlekedési Vétkek</button>
                <button class="nav-item" onclick="filterCat('HATÓSÁG', this)">Hatósági Ügyek</button>
                <button class="nav-item" onclick="filterCat('KÖZREND', this)">Közrend & Bűnözés</button>
                <button class="nav-item" onclick="filterCat('SZEMÉLY', this)">Személy & Vagyon</button>
            </div>
        </div>

        <!-- KÖZÉPSŐ OSZLOP -->
        <div class="panel">
            <div class="panel-header">
                <span>BTK ADATBÁZIS</span>
                <span id="cardCount" style="color: var(--text-muted);">0 tétel</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="Gyorskeresés kód vagy név alapján..." oninput="renderCards()">
            </div>
            <div class="matrix-grid" id="matrixGrid">
                <!-- JavaScript tölti fel -->
            </div>
        </div>

        <!-- JOBB OSZLOP -->
        <div class="panel">
            <div class="panel-header">
                <span>ELJÁRÁSI JEGYZŐKÖNYV</span>
                <button onclick="clearDocket()" style="background:none; border:none; color:var(--accent-red); cursor:pointer; font-size:0.75rem;">Kiürítés</button>
            </div>
            
            <div class="docket-content" id="docketContent">
                <div style="margin: auto; color: var(--text-muted); font-size: 0.8rem;">Nincs intézkedés alá vont vádpont.</div>
            </div>

            <div class="mod-bar">
                <button class="btn-mod" onclick="setMod(0.75, this)">-25% ENYH.</button>
                <button class="btn-mod active" onclick="setMod(1, this)">ALAPÉRTÉK</button>
                <button class="btn-mod" onclick="setMod(1.5, this)">+50% SÚLY.</button>
            </div>

            <div class="summary-box">
                <div class="sum-row">
                    <span>Pénzbírság:</span>
                    <span class="val-fine" id="dispFine">0 Ft</span>
                </div>
                <div class="sum-row">
                    <span>Szabadságvesztés:</span>
                    <span class="val-jail" id="dispJail">0 perc</span>
                </div>
                <button class="btn-export" onclick="copyLog()">JEGYZŐKÖNYV MÁSOLÁSA</button>
            </div>
        </div>
    </div>

    <script>
        const btkDb = [
            { code: "§1.1", title: "Tilosban parkolás", fine: 30000, jail: 0, cat: "KÖZLEKEDÉS" },
            { code: "§1.3", title: "Súlyos sebességtúllépás", fine: 90000, jail: 0, cat: "KÖZLEKEDÉS" },
            { code: "§1.20", title: "Menekülés járművel", fine: 150000, jail: 20, cat: "KÖZLEKEDÉS" },
            { code: "§2.1", title: "Intézkedés akadályozása", fine: 80000, jail: 10, cat: "HATÓSÁG" },
            { code: "§2.6", title: "Hivatalos személy elleni erőszak", fine: 200000, jail: 30, cat: "HATÓSÁG" },
            { code: "§3.1", title: "Garázdaság", fine: 120000, jail: 15, cat: "KÖZREND" },
            { code: "§3.6", title: "Illegális fegyverbirtoklás (Nehéz)", fine: 350000, jail: 40, cat: "KÖZREND" },
            { code: "§3.9", title: "Kábítószer kereskedelem", fine: 300000, jail: 35, cat: "KÖZREND" },
            { code: "§4.7", title: "Emberölés", fine: 500000, jail: 60, cat: "SZEMÉLY" },
            { code: "§4.9", title: "Emberrablás", fine: 450000, jail: 50, cat: "SZEMÉLY" },
            { code: "§5.11", title: "Bankrablás", fine: 450000, jail: 40, cat: "SZEMÉLY" }
        ];

        let selectedCat = 'ALL';
        let docket = [];
        let multiplier = 1;

        function filterCat(cat, btn) {
            selectedCat = cat;
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCards();
        }

        function renderCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('matrixGrid');
            grid.innerHTML = '';

            const filtered = btkDb.filter(i => {
                const matchCat = selectedCat === 'ALL' || i.cat === selectedCat;
                const matchQuery = i.title.toLowerCase().includes(query) || i.code.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });

            document.getElementById('cardCount').innerText = `${filtered.length} tétel`;

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'btk-card';
                card.onclick = () => addItem(item);
                card.innerHTML = `
                    <div class="btk-code">${item.code}</div>
                    <div class="btk-title">${item.title}</div>
                    <div class="btk-meta">
                        <span>${item.fine.toLocaleString()} Ft</span>
                        <span>${item.jail} perc</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addItem(item) {
            docket.push({ ...item, id: Date.now() + Math.random() });
            renderDocket();
        }

        function removeItem(id) {
            docket = docket.filter(i => i.id !== id);
            renderDocket();
        }

        function clearDocket() {
            docket = [];
            renderDocket();
        }

        function setMod(m, btn) {
            multiplier = m;
            document.querySelectorAll('.btn-mod').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderDocket();
        }

        function renderDocket() {
            const container = document.getElementById('docketContent');
            container.innerHTML = '';

            if (docket.length === 0) {
                container.innerHTML = '<div style="margin: auto; color: var(--text-muted); font-size: 0.8rem;">Nincs intézkedés alá vont vádpont.</div>';
                updateTotals(0, 0);
                return;
            }

            let totalFine = 0;
            let totalJail = 0;

            docket.forEach(item => {
                const f = Math.round(item.fine * multiplier);
                const j = Math.round(item.jail * multiplier);
                totalFine += f;
                totalJail += j;

                const row = document.createElement('div');
                row.className = 'docket-item';
                row.innerHTML = `
                    <div>
                        <div style="font-weight:600;">${item.code} ${item.title}</div>
                        <div style="color:var(--text-muted); font-size:0.75rem;">${f.toLocaleString()} Ft | ${j} perc</div>
                    </div>
                    <button onclick="removeItem(${item.id})" style="background:none; border:none; color:var(--accent-red); cursor:pointer;">✖</button>
                `;
                container.appendChild(row);
            });

            updateTotals(totalFine, totalJail);
        }

        function updateTotals(f, j) {
            document.getElementById('dispFine').innerText = f.toLocaleString() + ' Ft';
            document.getElementById('dispJail').innerText = j + ' perc';
        }

        function copyLog() {
            if (docket.length === 0) return;
            let txt = "--- ORFK JEGYZŐKÖNYV ---\n";
            docket.forEach(i => {
                txt += `• ${i.code} ${i.title}\n`;
            });
            txt += `\nBírság: ${document.getElementById('dispFine').innerText}\nBörtön: ${document.getElementById('dispJail').innerText}`;
            navigator.clipboard.writeText(txt);
            alert("Jegyzőkönyv kimásolva!");
        }

        renderCards();
    </script>
</body>
</html>
